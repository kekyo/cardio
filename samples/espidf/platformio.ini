[platformio]
default_envs = esp32s3

[env]
platform = espressif32 @ 7.0.0
framework = espidf
build_flags = -I../../include -DCARDIO_WITH_ESP_EVENT=1
; The ESP-IDF component supplies Unity and its UART output.
lib_ignore = Unity
test_speed = 115200

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32s3-core]
extends = env:esp32s3
build_flags = ${env.build_flags} -DCARDIO_HAS_POSIX_FD=0 -DCARDIO_TEST_CORE_ONLY

[env:esp32s3-exceptions]
extends = env:esp32s3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.exceptions

[env:esp32]
board = esp32dev

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32s2]
board = esp32-s2-saola-1

[env:esp32c6]
board = esp32-c6-devkitc-1
