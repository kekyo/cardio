[platformio]
default_envs = esp32s3

[env]
platform = espressif32 @ 7.0.0
framework = espidf
build_flags = -I../../include
; PlatformIO also puts this C++ option on the Unity C translation unit.
build_unflags = -fuse-cxa-atexit
test_speed = 115200

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32s3-core]
extends = env:esp32s3
build_flags = ${env.build_flags} -DCARDIO_HAS_POSIX_FD=0 -DCARDIO_TEST_CORE_ONLY

[env:esp32s3-exceptions]
extends = env:esp32s3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.exceptions
