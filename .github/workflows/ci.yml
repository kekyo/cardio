name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    env:
      WINEARCH: win64
      WINEDEBUG: "-all"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ \
            g++-mingw-w64-x86-64 \
            libglib2.0-dev \
            liburing-dev \
            make \
            pkg-config \
            wine \
            wine64 \
            xvfb \
            zip \
            unzip

      - name: Verify dependencies
        run: |
          g++ --version
          x86_64-w64-mingw32-g++ --version
          wine --version
          pkg-config --exists liburing glib-2.0 "gio-2.0 >= 2.44"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build and test
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/29.0.14206865
          WINEPREFIX: ${{ runner.temp }}/cardio-wine
        run: xvfb-run --auto-servernum ./build.sh

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

  android-runtime:
    name: Android runtime (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API 24 / 4 KiB
            api: 24
            image_tag: google_apis
            page_size: 4096
          - name: API 35 / 16 KiB
            api: 35
            image_tag: google_apis_ps16k
            page_size: 16384
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/29.0.14206865
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Android system image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}/${{ matrix.image_tag }}/x86_64
          key: android-system-image-${{ runner.os }}-${{ matrix.api }}-${{ matrix.image_tag }}-x86_64-v1

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run Android tests
        run: >-
          tests/android/run_emulator_tests.sh
          ${{ matrix.api }}
          ${{ matrix.image_tag }}
          ${{ matrix.page_size }}

  android-runtime-api35-4k:
    name: Android runtime (API 35 / 4 KiB, extended)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/29.0.14206865
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Android system image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: android-system-image-${{ runner.os }}-35-google_apis-x86_64-v1

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run Android tests
        run: tests/android/run_emulator_tests.sh 35 google_apis 4096
